<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Ultimate Tic-Tac-Toe</title>
<meta name="theme-color" content="#0b0d13" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ultimate TTT" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">

  <!-- LOBBY -->
  <section id="lobby-screen" class="screen lobby-screen">
    <div class="lobby-hero">
      <img src="assets/hero-banner.jpg" alt="Ultimate Tic Tac Toe" class="hero-img" />
    </div>

    <div class="lobby-card">
      <div class="lang-switch" role="group" aria-label="Language">
        <button class="lang-btn" data-lang="en" type="button">EN</button>
        <button class="lang-btn" data-lang="sv" type="button">SV</button>
      </div>

      <p class="app-subtitle" data-i18n="app_subtitle">Play against a friend in real time</p>

      <div class="mode-grid">
        <button class="tab-btn mode-cell mode-x active" data-tab="create">
          <span class="mode-icon">X</span>
          <span class="mode-label" data-i18n="mode_create_label">Create room</span>
        </button>
        <div class="mode-cell mode-empty" aria-hidden="true">
          <span class="mode-vs">vs</span>
        </div>
        <button class="tab-btn mode-cell mode-o" data-tab="join">
          <span class="mode-icon">O</span>
          <span class="mode-label" data-i18n="mode_join_label">Join</span>
        </button>
      </div>

      <div class="tab-panel" id="tab-create">
        <p class="tab-desc" data-i18n="tab_create_desc">Create a new room and share the code with your opponent. You'll be X.</p>
        <button id="create-room-btn" class="primary-btn" data-i18n="create_room_btn">Create room</button>
      </div>

      <div class="tab-panel hidden" id="tab-join">
        <p class="tab-desc" data-i18n="tab_join_desc">Enter the 4-digit room code. You'll be O.</p>
        <input
          id="join-code-input"
          class="code-input"
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="4"
          placeholder="0000"
          autocomplete="off"
        />
        <button id="join-room-btn" class="primary-btn" data-i18n="join_room_btn">Join room</button>
      </div>

      <p id="lobby-error" class="error-text hidden"></p>

      <button id="rules-link-lobby" class="rules-link" type="button" data-i18n="rules_link">How to play? See the rules</button>
    </div>
  </section>

  <!-- SPEL -->
  <section id="game-screen" class="screen hidden">
    <header class="status-bar">
      <div class="status-left">
        <span class="role-badge" id="role-badge">X</span>
        <span class="room-code-tag" id="room-code-tag">Rum: ----</span>
      </div>
      <div class="status-center" id="status-text" data-i18n="status_waiting">Waiting for opponent...</div>
      <button class="icon-btn" id="rules-link-game" data-i18n-title="rules_btn_title" title="Rules" aria-label="Rules">?</button>
      <button class="icon-btn leave-btn" id="leave-btn" data-i18n-title="leave_btn_title" title="Leave room" aria-label="Leave room">✕</button>
    </header>

    <div class="board-wrap">
      <div class="game-board" id="game-board"></div>
    </div>

    <div class="share-panel hidden" id="share-panel">
      <p data-i18n="share_panel_text">Share the code with your opponent:</p>
      <div class="share-row">
        <span class="share-code" id="share-code">0000</span>
        <button id="copy-link-btn" class="secondary-btn" data-i18n="copy_link_btn">Copy link</button>
      </div>
    </div>
  </section>

  <!-- SPEL SLUT -->
  <div id="gameover-modal" class="modal hidden">
    <div class="modal-card">
      <h2 id="gameover-title">Draw!</h2>
      <p id="gameover-desc"></p>
      <button id="gameover-restart-btn" class="primary-btn" data-i18n="gameover_restart_btn">Play again</button>
      <button id="gameover-leave-btn" class="secondary-btn modal-secondary" data-i18n="gameover_leave_btn">Back to lobby</button>
    </div>
  </div>

  <!-- SPELREGLER -->
  <div id="rules-modal" class="modal hidden">
    <div class="modal-card rules-card">
      <h2 data-i18n="rules_title">Rules</h2>
      <div class="rules-content" data-i18n-html="rules_html"></div>
      <button id="rules-close-btn" class="primary-btn" data-i18n="rules_close_btn">Close</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
